# Local stack. Sized for an 8 GB machine: every JVM is capped at -Xmx256m.
# Host ports bind to 127.0.0.1 only.
name: pickupdesk

x-service: &service
  build:
    context: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # any fixed 22-char base64 UUID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 15s
      retries: 20

  order-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: order
      DB_PASSWORD: order
      INVENTORY_URL: http://inventory-service:8080
      PAYMENT_URL: http://payment-service:8080
      KAFKA_BOOTSTRAP: kafka:9092
      PICKUP_WINDOW_SECONDS: ${PICKUP_WINDOW_SECONDS:-604800}
    ports:
      - "127.0.0.1:8081:8080"

  inventory-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: inventory
      RESERVE_STRATEGY: ${RESERVE_STRATEGY:-conditional}   # bench/reserve_strategy_bench.py switches this
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "127.0.0.1:8082:8080"

  payment-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: payment
      DB_PASSWORD: payment
    ports:
      - "127.0.0.1:8083:8080"

volumes:
  pgdata:
