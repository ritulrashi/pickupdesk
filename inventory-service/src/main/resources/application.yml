spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080
  shutdown: graceful

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      service: inventory-service

inventory:
  # conditional | for-update | optimistic  (ADR-007; conditional is the production choice)
  reserve-strategy: ${RESERVE_STRATEGY:conditional}
  optimistic-max-attempts: 5
  default-ttl-seconds: 900
  expiry:
    enabled: ${EXPIRY_ENABLED:true}
    interval-ms: ${EXPIRY_INTERVAL_MS:10000}
    batch-size: 100
  events:
    enabled: ${EVENTS_ENABLED:true}
    topic: order-events

# Exposed on /actuator/info so benchmarks can verify which strategy they measured.
info:
  reserveStrategy: ${inventory.reserve-strategy}
